# yaml-language-server: $schema=https://promptfoo.dev/config-schema.json
description: memobank skill — behavioral trigger evaluations (local Qwen via llamacpp)

# Provider options (uncomment the one you want to use):
#
# Option A — llamacpp HTTP server at 127.0.0.1:8080 (default)
#   Start with: llama-server -m <model.gguf> --port 8080
#
# Option B — pi CLI exec provider (no server needed)
#   Requires: provider-pi.js + pi installed on PATH
#   Switch by replacing the provider block with:
#     - id: file://provider-pi.js
#       label: pi-local
#
# Option C — Ollama HTTP server at localhost:11434
#   Start with: ollama serve
#   Switch apiBaseUrl and model name accordingly
#
# NOTE: grader bias — llm-rubric uses the same model as the subject.
# For objective grading, override defaultTest.options.provider with a
# separate model (e.g. a Claude API endpoint via ANTHROPIC_API_KEY).

providers:
  - id: openai:chat:qwen2.5-coder-32b-instruct-q5_k_m.gguf
    label: qwen-local
    config:
      apiBaseUrl: http://127.0.0.1:8080/v1
      apiKey: local
      temperature: 0
      max_tokens: 1024

prompts:
  - file://prompts/skill-behavior.json

defaultTest:
  options:
    # Same local model for llm-rubric grading (grader bias known limitation —
    # swap for an independent model when API access is available)
    provider:
      id: openai:chat:qwen2.5-coder-32b-instruct-q5_k_m.gguf
      config:
        apiBaseUrl: http://127.0.0.1:8080/v1
        apiKey: local
  assert:
    - type: latency
      threshold: 120000 # 2 min — local model is slow

tests:
  # ---------------------------------------------------------------------------
  # T1 — session start
  # Trigger: first message involves code/files
  # Expected: memo map + memo recall --code BEFORE any file exploration
  # ---------------------------------------------------------------------------
  - description: '01 session-start: runs recall before any code action'
    threshold: 0.7 # timing-critical — raised from 0.5
    vars:
      scenario: >-
        I need to refactor the queue processor to fix a deduplication bug.
        The Jaccard similarity threshold isn't filtering close-enough duplicates.
    assert:
      - type: icontains
        value: memo recall
        weight: 3
        metric: triggers-recall
      - type: icontains
        value: memo map
        weight: 1
        metric: triggers-map
      - type: icontains
        value: '--code'
        weight: 2
        metric: recall-uses-code-flag
      - type: llm-rubric
        value: >-
          The response describes running memo map and/or memo recall with --code
          BEFORE any file exploration, grep, or code editing. The recall step is
          the first action taken, not something done after starting to look at code.
        weight: 2
        metric: recall-ordering
      - type: llm-rubric
        value: >-
          The response does NOT describe reading, editing, grepping, or otherwise
          exploring source files before the memo recall step completes. File
          exploration, if mentioned at all, comes strictly after recall.
        weight: 2
        metric: no-code-before-recall

  # ---------------------------------------------------------------------------
  # T3 — bug-fix lesson
  # Trigger: non-obvious bug just fixed
  # Expected: memo write lesson immediately, with Problem/Root Cause/Solution
  # ---------------------------------------------------------------------------
  - description: '02 bug-fix-lesson: writes lesson immediately after non-obvious fix'
    threshold: 0.5
    vars:
      scenario: >-
        [MID-SESSION — session recall was already run at the start of this conversation]
        I just diagnosed and fixed a non-obvious bug: the Stop hook on Windows was silently
        broken because PowerShell 5.1 does not support the && operator. When memo capture
        failed, process-queue never ran, so no memories were being saved on Windows.
        The fix was switching from && to ; so process-queue always runs regardless of
        capture's exit code. The change is committed. Write a lesson memory now.
    assert:
      - type: icontains
        value: memo write lesson
        weight: 3
        metric: writes-lesson
      - type: llm-rubric
        value: >-
          The response immediately writes a lesson memory using memo write lesson
          without deferring or asking for confirmation. The lesson --name is a
          kebab-case slug describing the Windows/PowerShell && operator bug. The
          --content includes Problem, Root Cause, and Solution sections. The
          lesson is written as the only action described.
        weight: 2
        metric: lesson-quality
      - type: llm-rubric
        value: >-
          The response does NOT skip or defer writing the lesson, does NOT ask for
          confirmation before writing, and does NOT suggest the Stop hook will
          handle memory capture instead of writing the lesson now.
        weight: 2
        metric: no-deferred-lesson

  # ---------------------------------------------------------------------------
  # T2 — pre-compact
  # Trigger: /compact issued
  # Expected: memo capture + memo process-queue BEFORE compact runs
  # ---------------------------------------------------------------------------
  - description: '03 pre-compact: captures session state before /compact'
    threshold: 0.7 # timing-critical — raised from 0.5
    vars:
      scenario: /compact
    assert:
      - type: icontains
        value: memo capture
        weight: 3
        metric: triggers-capture
      - type: icontains
        value: memo process-queue
        weight: 2
        metric: drains-queue
      - type: llm-rubric
        value: >-
          The response runs memo capture --auto --silent and memo process-queue
          BEFORE the compact executes. It does not skip the capture step on the
          assumption that the Stop hook will handle it, because the compact would
          erase the current session context before the hook fires.
        weight: 2
        metric: capture-before-compact
      - type: llm-rubric
        value: >-
          The response does NOT claim the Stop hook will handle capture and therefore
          skip the manual memo capture step. Capture happens explicitly, before /compact.
        weight: 2
        metric: no-stop-hook-excuse
      - type: not-icontains
        value: 'stop hook will handle'
        weight: 1
        metric: no-hook-excuse-literal

  # ---------------------------------------------------------------------------
  # T7 — stale memory
  # Trigger: recalled memory contradicts current code
  # Expected: memo correct <path> immediately, not just verbal acknowledgement
  # ---------------------------------------------------------------------------
  - description: '04 stale-memory: corrects contradicted recalled memory immediately'
    threshold: 0.5
    vars:
      scenario: >-
        [MID-SESSION — session recall was already run at the start of this conversation]
        MEMORY.md shows a recalled entry at .memobank/lesson/distill-personal-tier.md
        saying "--to personal is not implemented; use memo migrate --tier personal as
        a workaround". But reading the current src/commands/distill.ts confirms that
        --to personal has been implemented since v0.10.0. The recalled memory is stale
        and incorrect. Correct it now.
    assert:
      - type: icontains
        value: memo correct
        weight: 3
        metric: corrects-memory
      - type: llm-rubric
        value: >-
          The response immediately runs memo correct .memobank/lesson/distill-personal-tier.md
          (or a similar path) to record the correction. It does not just tell the user
          the memory is wrong — it executes memo correct as the immediate next action
          with the file path provided in the scenario.
        weight: 2
        metric: correction-immediacy
      - type: llm-rubric
        value: >-
          The response does NOT only inform the user that the memory is stale without
          also running memo correct. It does NOT defer the correction until after
          completing the implementation task.
        weight: 2
        metric: no-verbal-only-correction

  # ---------------------------------------------------------------------------
  # T4 — architecture decision
  # Trigger: tech/architecture choice confirmed
  # Expected: memo write decision BEFORE any implementation, correct type (not lesson)
  # ---------------------------------------------------------------------------
  - description: '05 architecture-decision: writes decision before implementing change'
    threshold: 0.5
    vars:
      scenario: >-
        [MID-SESSION — session recall was already run at the start of this conversation]
        Architecture decision confirmed after discussion: use text-engine as the default
        search engine instead of lancedb. Rationale: zero external dependencies beats
        vector similarity for most users — lancedb stays opt-in via config. We have NOT
        yet changed any code. Record this decision as a memory now, before touching config.
    assert:
      - type: icontains
        value: memo write decision
        weight: 3
        metric: writes-decision
      - type: not-icontains
        value: memo write lesson
        weight: 2
        metric: correct-type-not-lesson
      - type: llm-rubric
        value: >-
          The response immediately writes a decision memory using memo write decision
          as the first action, before any code changes. The --content includes at
          least: why the decision was made (context or rationale), what was decided,
          and what the impact or trade-offs are (section names are flexible).
        weight: 2
        metric: decision-before-impl
      - type: llm-rubric
        value: >-
          The response does NOT implement any code changes before writing the decision
          memory. It does NOT use memo write lesson for this architectural choice.
          The decision is written now, not after implementation.
        weight: 2
        metric: no-impl-before-decision

  # ---------------------------------------------------------------------------
  # T5 — workflow discovery
  # Trigger: repeatable multi-step process just discovered
  # Expected: memo write workflow (not lesson or decision)
  # ---------------------------------------------------------------------------
  - description: '06 workflow-discovery: writes workflow after discovering repeatable process'
    threshold: 0.5
    vars:
      scenario: >-
        [MID-SESSION — session recall was already run at the start of this conversation]
        We just finished setting up LanceDB vector search from scratch for the first time.
        The non-obvious steps were: npm install @lancedb/lancedb, set engine: lancedb in
        .memobank/config.yaml, run memo init --engine lancedb, then verify with
        memo recall "embeddings" --limit 5. Nothing is in the docs about this sequence.
        Capture this process so we never have to rediscover it.
    assert:
      - type: icontains
        value: memo write workflow
        weight: 3
        metric: writes-workflow
      - type: not-icontains
        value: memo write lesson
        weight: 2
        metric: correct-type-not-lesson
      - type: not-icontains
        value: memo write decision
        weight: 2
        metric: correct-type-not-decision
      - type: llm-rubric
        value: >-
          The response writes a workflow memory using memo write workflow (not lesson
          or decision). The --name is a kebab-case slug describing the LanceDB setup
          process. The --content includes the ordered steps of the process with the
          exact commands used.
        weight: 2
        metric: workflow-type-and-content

  # ---------------------------------------------------------------------------
  # T6 — architecture mapping
  # Trigger: system structure just traced and understood
  # Expected: memo write architecture (not lesson or decision)
  # ---------------------------------------------------------------------------
  - description: '07 architecture-mapping: writes architecture memory after mapping system structure'
    threshold: 0.5
    vars:
      scenario: >-
        [MID-SESSION — session recall was already run at the start of this conversation]
        We just traced through src/core/store.ts and fully mapped the three-tier memory
        resolution: when the same filename exists in multiple tiers, project wins over
        personal, personal wins over workspace. The resolveProjectId function determines
        which directory each tier maps to. This is non-obvious and worth preserving —
        write the appropriate memory now.
    assert:
      - type: icontains
        value: memo write architecture
        weight: 3
        metric: writes-architecture
      - type: not-icontains
        value: memo write lesson
        weight: 2
        metric: correct-type-not-lesson
      - type: not-icontains
        value: memo write decision
        weight: 2
        metric: correct-type-not-decision
      - type: llm-rubric
        value: >-
          The response writes an architecture memory using memo write architecture
          (not lesson or decision). The --content describes the three-tier priority
          logic (project > personal > workspace) and the role of resolveProjectId.
          The memory captures structural understanding, not a bug fix or a choice
          between alternatives.
        weight: 2
        metric: architecture-type-and-content

  # ---------------------------------------------------------------------------
  # T8 — memo study promotion
  # Trigger: lesson recalled 3+ times this week
  # Expected: memo study <lesson-name> to promote to CLAUDE.md
  # ---------------------------------------------------------------------------
  - description: '08 study-promotion: promotes high-recall lesson to CLAUDE.md via memo study'
    threshold: 0.5
    vars:
      scenario: >-
        [MID-SESSION — session recall was already run at the start of this conversation]
        MEMORY.md shows the lesson "windows-powershell-ampersand-operator" has been
        recalled 3 times this week. The skill protocol says lessons recalled 3 or more
        times in a week should be promoted to CLAUDE.md via memo study. Take the
        appropriate action now.
    assert:
      - type: icontains
        value: memo study
        weight: 3
        metric: triggers-study
      - type: icontains
        value: windows-powershell-ampersand-operator
        weight: 2
        metric: targets-correct-lesson
      - type: llm-rubric
        value: >-
          The response runs memo study windows-powershell-ampersand-operator (or
          memo study --auto) to promote the high-recall lesson to CLAUDE.md.
          The study command is executed immediately, not deferred. The lesson
          name from the scenario is included in the command.
        weight: 2
        metric: study-with-lesson-name
      - type: llm-rubric
        value: >-
          The response does NOT skip the memo study step. It does NOT only explain
          that the lesson should be promoted without actually running the command.
        weight: 1
        metric: no-skipped-study
